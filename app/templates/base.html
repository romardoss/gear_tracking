<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Спорядження{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--fg:#1c1f24;--card:#fff;--line:#d9dde3;--acc:#1f6feb;--danger:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e6e8eb;--card:#1e2126;--line:#33383f;--acc:#58a6ff;--danger:#ff6b5e}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
nav{display:flex;gap:16px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
nav a{color:var(--acc);text-decoration:none;font-weight:600}nav form{margin-left:auto}
a{color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin:12px 0}
label{display:block;margin:12px 0 4px;font-weight:600}
input[type=text],input[type=password],input[type=number],input[type=file]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
button,.btn{display:inline-block;padding:9px 16px;border:0;border-radius:8px;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
button.link{background:none;color:var(--acc);padding:0}
.flash{padding:10px 14px;border-radius:8px;background:#fff3cd;color:#664d03;margin:12px 0}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
img.thumb{width:48px;height:48px;object-fit:cover;border-radius:6px}
img.big{max-width:100%;border-radius:10px}
.muted{color:#8a919b;font-size:.9em}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
{% if session.admin %}
<nav><a href="{{ url_for('admin_items') }}">Предмети</a><a href="{{ url_for('admin_qr') }}">QR-коди</a>
<form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="link">Вийти</button></form></nav>
{% endif %}
<main>
{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}
</main>
</body></html>
