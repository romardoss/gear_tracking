{% extends "base.html" %}{% block title %}Предмети{% endblock %}
{% block body %}
<div class="row"><h2 style="margin:0">Предмети ({{ items|length }})</h2><a class="btn" style="margin-left:auto" href="{{ url_for('edit_item') }}">+ Додати</a></div>
<div class="card"><table>
<tr><th>ID</th><th></th><th>Назва</th><th>За ким</th><th></th></tr>
{% for i in items %}<tr>
<td>{{ '%04d' % i.id }}</td>
<td>{% if i.photo %}<img class="thumb" src="{{ url_for('photo', name=i.photo) }}" alt="">{% endif %}</td>
<td><a href="{{ url_for('view_item', item_id=i.id) }}">{{ i.name }}</a></td>
<td>{{ i.holder }}</td>
<td class="row"><a href="{{ url_for('edit_item', item_id=i.id) }}">Редагувати</a>
<form method="post" action="{{ url_for('delete_item', item_id=i.id) }}" onsubmit="return confirm('Видалити?')"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="link">Видалити</button></form></td>
</tr>{% else %}<tr><td colspan="5" class="muted">Поки порожньо.</td></tr>{% endfor %}
</table></div>{% endblock %}
